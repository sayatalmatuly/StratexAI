<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stratex AI — Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />

    <style>
      body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
      .chat-layout {
        flex: 1;
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 20px;
        padding: 20px;
        height: calc(100vh - 70px);
        max-width: 1600px;
        margin: 0 auto;
        width: 100%;
      }
      .sidebar { display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
      .chat-main { display: flex; flex-direction: column; overflow: hidden; }
      .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: thin; }

      .composer { padding: 20px; border-top: 1px solid var(--glass-border); }
      .chat-bubble { max-width: 80%; padding: 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .chat-bubble.ai { background: rgba(255,255,255,0.04); border: 1px solid var(--glass-border); border-bottom-left-radius: 4px; }
      .chat-bubble.user { background: linear-gradient(135deg, var(--primary), #5b21b6); color: white; margin-left: auto; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(111,71,235,0.3); }

      .input-box {
        width: 100%;
        background: rgba(0,0,0,0.3);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        padding: 16px;
        padding-left: 52px;
        color: white;
        font-family: inherit;
        resize: none;
        transition: 0.3s;
      }
      .input-box:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(111,71,235,0.2); }

      .send-btn{
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), #5b21b6);
        border: 1px solid rgba(255,255,255,0.15);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: all .25s ease;
        box-shadow: 0 8px 20px rgba(112,71,235,.4);
      }
      .send-btn::before{
        content: "";
        width: 10px;
        height: 10px;
        border-top: 2px solid white;
        border-right: 2px solid white;
        transform: rotate(-45deg);
        margin-bottom: -2px;
      }
      .send-btn:hover{ transform: translateY(-2px); box-shadow: 0 12px 30px rgba(112,71,235,.6); }
      .send-btn:active{ transform: scale(.95); }

      .prompt-card { padding: 15px; text-align: left; cursor: pointer; transition: 0.2s; }
      .prompt-card:hover { background: rgba(255,255,255,0.05); border-color: var(--primary); }
      .prompt-title { font-weight: 600; color: white; font-size: 14px; }
      .prompt-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

      .mobile-menu-btn {
        display: none;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.06);
        align-items: center;
        justify-content: center;
        gap: 5px;
        cursor: pointer;
      }
      .mobile-menu-btn span {
        display: block;
        width: 22px;
        height: 2px;
        background: white;
        border-radius: 2px;
      }

      .btn--sm {
        padding: 8px 14px;
        font-size: 12px;
        border-radius: 999px;
      }

      .sidebar-backdrop {
        display: none;
        position: fixed;
        top: 70px;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1500;
      }

      @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

      @media (max-width: 800px) {
        .chat-layout { grid-template-columns: 1fr; padding: 10px; }

        .mobile-menu-btn { display: inline-flex; }

        .sidebar {
          display: flex;
          position: fixed;
          top: 70px;
          left: 0;
          width: min(86vw, 320px);
          height: calc(100vh - 70px);
          transform: translateX(-110%);
          transition: transform 0.3s ease;
          z-index: 2000;
        }

        .sidebar.is-open { transform: translateX(0); }

        .sidebar-backdrop.show { display: block; }
      }
    </style>
  </head>

  <body>
    <div class="bg">
      <div class="aurora-blob a1"></div>
      <div class="aurora-blob a3"></div>
      <div class="noise-overlay"></div>
    </div>

    <header class="nav" style="position: sticky;">
      <div class="container nav__inner" style="max-width: 100%; padding: 0 30px;">
        <a class="brand" href="index.html">
          <div class="brand__logo"><div class="brand__spark"></div></div>
          <span class="brand__text">Stratex</span>
        </a>

        <button id="mobile-menu-toggle" class="mobile-menu-btn single" aria-label="Open chats menu">
          <span></span>
        </button>

        <div class="nav__actions" style="display:flex; align-items:center; gap:12px;">
          <button id="login-btn" class="btn btn--primary btn--sm" type="button">🔐 Login</button>
          <button id="export-btn" class="btn btn--glass btn--sm" type="button">Export</button>
          <button id="logout-btn" class="btn btn--glass btn--sm" type="button" style="display:none;">🚪 Log out</button>
          <div class="status-badge"><span class="status-dot"></span> Guest</div>
        </div>
      </div>
    </header>

    <div id="sidebar-backdrop" class="sidebar-backdrop" aria-hidden="true"></div>

    <div class="chat-layout">
      <aside class="sidebar glass-panel">
        <div style="padding: 15px; border-bottom: 1px solid var(--glass-border); display:flex; align-items:center; justify-content:space-between; gap:10px;">
          <span class="text-muted" style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Chats</span>
          <button id="new-chat" class="btn btn--glass btn--sm" type="button">New</button>
        </div>

        <div id="chat-list" style="display:flex; flex-direction:column; gap:10px; padding: 10px; overflow:auto;"></div>

        <div style="padding: 10px; border-top: 1px solid var(--glass-border);">
          <div class="text-muted" style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 10px;">Prompts</div>

          <div class="glass-panel prompt-card" data-prompt="Create a rollout plan for a new CRM.">
            <div class="prompt-title">CRM rollout plan</div>
            <div class="prompt-desc">phases, timeline, KPI</div>
          </div>

          <div style="height: 10px;"></div>

          <div class="glass-panel prompt-card" data-prompt="Write a client apology email for a delayed delivery.">
            <div class="prompt-title">Client apology email</div>
            <div class="prompt-desc">clear, professional tone</div>
          </div>

          <div style="height: 10px;"></div>

          <div class="glass-panel prompt-card" data-prompt="Analyze current market trends for my niche and suggest opportunities.">
            <div class="prompt-title">Market trends</div>
            <div class="prompt-desc">with sources (logged-in)</div>
          </div>
        </div>
      </aside>

      <main class="chat-main glass-panel">
        <div class="messages" id="chat-container"></div>

        <div class="composer">
          <form action="#" style="position: relative;">
            <textarea class="input-box" rows="2" placeholder="Describe your task... (Enter to send)"></textarea>

            <button type="button" class="send-btn" aria-label="Send"></button>

            <input id="file-input" type="file" hidden multiple accept=".pdf,.docx,.txt,.png,.jpg,.jpeg,.webp" />
            <button id="attach-btn" type="button" class="btn btn--glass" style="position:absolute; left:10px; bottom:10px; padding:8px 12px; font-size:12px;">📎</button>
          </form>
        </div>
      </main>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
